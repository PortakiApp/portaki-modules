[package]
name = "local-guide"
version = "0.11.0"
edition.workspace = true
license.workspace = true
description = "Portaki local guide module — nearby spots and host picks"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
portaki-sdk = { version = "8.7.0", features = ["kv", "platform"] }
portaki-sdk-macros = { workspace = true }
portaki-connectors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = { workspace = true }

[dev-dependencies]
portaki-test-utils = { workspace = true }
serial_test = { workspace = true }
chrono = { workspace = true }
