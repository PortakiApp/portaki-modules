[package]
name = "guest-reviews"
version = "0.6.0"
edition.workspace = true
license.workspace = true
description = "Portaki guest reviews module — post-stay thank-you and review CTAs"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
portaki-sdk = { version = "8.0.1", features = ["email", "kv", "platform"] }
portaki-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = { workspace = true }

[dev-dependencies]
portaki-test-utils = { workspace = true }
serial_test = { workspace = true }
