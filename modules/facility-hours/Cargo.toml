[package]
name = "facility-hours"
version = "1.13.0"
edition.workspace = true
license.workspace = true
description = "Portaki facility hours module — pool, spa, and shared amenity schedules"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { workspace = true }
portaki-sdk = { version = "10.3.0", features = ["kv", "platform"] }
portaki-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
portaki-test-utils = { workspace = true }
serial_test = { workspace = true }
