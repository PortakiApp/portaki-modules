[package]
name = "lost-found"
version = "2.0.2"
edition.workspace = true
license.workspace = true
description = "Portaki lost & found — guest reports for lost or found items during the stay"
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "lost_found"

[dependencies]
portaki-sdk = { version = "8.8.1", features = ["email", "events", "platform", "repo"] }
portaki-sdk-macros = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = { workspace = true }

[dev-dependencies]
portaki-test-utils = { workspace = true }
serial_test = { workspace = true }
