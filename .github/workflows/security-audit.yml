# Une CVE paraît sans qu'on pousse de commit.
#
# La CI ne se déclenche que sur `push` et `pull_request`, et `changed-modules.sh` la restreint
# encore aux modules touchés : un avis RustSec publié sur une dépendance qu'on n'a pas modifiée
# depuis six mois ne déclencherait rien du tout. D'où le `schedule`, qui est le cœur de ce
# fichier.
#
# Ce que ces modules embarquent finit dans des Wasm publiés au catalogue et installés chez des
# hôtes : la dépendance vulnérable ne reste pas ici.
name: security-audit

on:
  schedule:
    # 06:28 UTC — décalé de l'heure pile, et des autres dépôts, pour ne pas empiler la file.
    - cron: "28 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "modules/*/Cargo.toml"
      - ".github/workflows/security-audit.yml"

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # L'action ouvre une issue sur le cadencement périodique — sans ça, la trouvaille reste dans
  # un journal que personne ne relit.
  issues: write
  checks: write

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
