name: ci

# Quality on pull_request; push main = publish path only (avoids feature push + PR double bill).
# workflow_dispatch: recover from Actions outages / 0-job runs without an empty tip commit
# (empty pushes are skipped by paths-ignore).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/CI.md"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/CI.md"
  # `module` sert au premier tir d'une liaison : publier UN module précis, sans attendre
  # qu'un commit le modifie. La liaison enregistrée au registre autorise `workflow_dispatch`.
  workflow_dispatch:
    inputs:
      module:
        description: "Publier ce module seul (laisser vide pour le comportement normal)"
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io/portakiapp
  CI_ARTIFACT_RETENTION_DAYS: "1"
  # La plateforme à qui annoncer la publication. GHCR reçoit l'artefact quoi qu'il arrive ;
  # c'est l'annonce qui le fait entrer dans un catalogue. Variable de dépôt pour viser un
  # staging sans toucher au workflow.
  PORTAKI_API_URL: ${{ vars.PORTAKI_API_URL || 'https://api.portaki.app' }}

jobs:
  changes:
    name: detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      any: ${{ steps.detect.outputs.any }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >>"$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >>"$GITHUB_OUTPUT"
          fi

      - uses: PortakiApp/portaki-release-action/install@v1

      # `portaki ci modules` lit la disposition dans les manifestes et rend `modules`,
      # `any` et `reason` dans GITHUB_OUTPUT. Il remplace `changed-modules.sh` —
      # quatre-vingt-douze lignes de bash et de jq qui ne servaient que ce dépôt.
      - name: Detect changed modules
        id: detect
        env:
          REQUESTED: ${{ inputs.module }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            portaki ci modules --only "$REQUESTED"
          else
            portaki ci modules --changed-since "${{ steps.base.outputs.ref }}"
          fi

  # fmt + clippy + test on one runner (setup cost ×3 was burning minutes).
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # Host targets only — wasm32 is for the wasm matrix job.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib

      - name: Integration tests
        run: cargo test --workspace --test integration

      - name: Doc tests
        run: cargo test --workspace --doc

  wasm:
    name: wasm (${{ matrix.module }})
    needs: [changes]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # `~/.cargo/bin` appartient au cache dédié ci-dessous, pas à celui-ci. Les deux le
          # revendiquaient : rust-cache restaurait un vieux `portaki`, puis le cache dédié
          # manquait sa clé (le tip du SDK avait bougé) et l'installation trouvait le binaire
          # déjà là. Un chemin, un propriétaire.
          cache-bin: "false"
          workspaces: modules/${{ matrix.module }} -> target
          shared-key: module-${{ matrix.module }}

      # L'action résout le CLI depuis `Cargo.lock` et met en cache sur cette version. Le
      # bloc précédent interrogeait le tip de `main` du SDK à chaque run, ce qui invalidait
      # le cache à chaque commit poussé là-bas.
      - uses: PortakiApp/portaki-release-action/install@v1
        with:
          working-directory: modules/${{ matrix.module }}

      - name: Build and lint (wasm)
        run: |
          set -euo pipefail
          module="${{ matrix.module }}"
          echo "=== portaki build: modules/${module} ==="
          (cd "modules/${module}" && portaki build --release)
          echo "=== portaki lint: modules/${module} ==="
          (cd "modules/${module}" && portaki lint)

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-${{ matrix.module }}
          path: |
            modules/${{ matrix.module }}/target/wasm32-unknown-unknown/release/*.wasm
            modules/${{ matrix.module }}/target/portaki/
          if-no-files-found: error
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  publish:
    name: publish (${{ matrix.module }})
    needs: [changes, wasm]
    if: >-
      needs.changes.outputs.any == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.module != ''))
    runs-on: ubuntu-latest
    # La liaison enregistrée au registre exige un environment sur le canal stable : c'est lui
    # qui porte les relecteurs obligatoires, et le meilleur rapport sécurité/effort du
    # dispositif. Sans lui, l'échange du jeton est refusé — `environment_required`.
    environment: release
    permissions:
      contents: read
      packages: write
      # Sans ce droit, GitHub n'émet aucun jeton OIDC et il n'y a rien à échanger contre un
      # credential de publication. C'est ce jeton qui remplace un secret longue durée.
      id-token: write
    # Un seul job de publication par module à la fois. Deux qui poussent le même module en
    # parallèle écrasent tour à tour le même tag OCI, et le catalogue finit par référencer un
    # digest que le tag ne porte plus. On met en file : `cancel-in-progress` interromprait une
    # publication en cours, ce qui est pire que de la faire attendre.
    concurrency:
      group: publish-${{ matrix.module }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # upload-artifact roots at modules/<mod>/target (LCA of wasm + portaki/).
      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-${{ matrix.module }}
          path: modules/${{ matrix.module }}/target

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `build: false` : le job `wasm` a déjà compilé et linté, et l'artefact vient d'être
      # récupéré. Recompiler ici pousserait un binaire que personne n'a vérifié.
      - uses: PortakiApp/portaki-release-action@v1
        with:
          working-directory: modules/${{ matrix.module }}
          build: false
          registry: ${{ env.REGISTRY }}
          api-url: ${{ env.PORTAKI_API_URL }}

      # Propre à cette organisation, donc hors de l'action : un paquet fraîchement créé
      # naît privé, et un catalogue public ne peut pas le lire.
      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: portaki-modules-${{ matrix.module }}
        run: |
          set -euo pipefail
          seen="$(gh api "orgs/PortakiApp/packages/container/${PACKAGE}" --jq .visibility 2>/dev/null || echo unknown)"
          if [ "$seen" = "public" ]; then
            echo "${PACKAGE} is already public."
            exit 0
          fi
          gh api --method PATCH "orgs/PortakiApp/packages/container/${PACKAGE}" --field visibility=public \
            || echo "::warning::could not set ${PACKAGE} public — do it once by hand in the package settings"

  quality:
    name: quality
    needs: [changes, rust, wasm, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Quality gate
        env:
          ANY: ${{ needs.changes.outputs.any }}
          RUST: ${{ needs.rust.result }}
          WASM: ${{ needs.wasm.result }}
          PUBLISH: ${{ needs.publish.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$RUST" != "success" ]; then
            echo "Quality gate failed: RUST=$RUST"
            exit 1
          fi

          if [ "$ANY" = "true" ]; then
            if [ "$WASM" != "success" ]; then
              echo "Quality gate failed: WASM=$WASM"
              exit 1
            fi
            if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
              if [ "$PUBLISH" != "success" ]; then
                echo "Quality gate failed: PUBLISH=$PUBLISH"
                exit 1
              fi
            fi
          else
            echo "No module changes — wasm/publish not required."
          fi

          echo "Quality gate passed."
