name: ci

# Quality on pull_request; push main = publish path only (avoids feature push + PR double bill).
# workflow_dispatch: recover from Actions outages / 0-job runs without an empty tip commit
# (empty pushes are skipped by paths-ignore).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/CI.md"
  # `module` sert au premier tir d'une liaison : publier un module précis, sans attendre qu'un
  # commit le modifie. `all` vise les vingt-trois d'un coup — remettre tout le dépôt au registre
  # après une panne d'Actions, ou derrière une montée de SDK que release-please a bumpée partout.
  # La liaison enregistrée au registre autorise `workflow_dispatch`.
  workflow_dispatch:
    inputs:
      module:
        description: "Un module, plusieurs séparés par des virgules, `all` pour tous (vide : comportement normal)"
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # La plateforme où publier : son registre délivre le droit de push vers son dépôt OCI, reçoit
  # l'annonce et fait entrer la version au catalogue. Variable de dépôt pour viser un staging
  # sans toucher au workflow.
  PORTAKI_API_URL: ${{ vars.PORTAKI_API_URL || 'https://api.portaki.app' }}

jobs:
  changes:
    name: detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      any: ${{ steps.detect.outputs.any }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >>"$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >>"$GITHUB_OUTPUT"
          fi

      - uses: PortakiApp/portaki-release-action/install@v2

      # `portaki ci modules` lit la disposition dans les crates et rend `modules`,
      # `any` et `reason` dans GITHUB_OUTPUT. Il remplace `changed-modules.sh` —
      # quatre-vingt-douze lignes de bash et de jq qui ne servaient que ce dépôt.
      - name: Detect changed modules
        id: detect
        env:
          REQUESTED: ${{ inputs.module }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = "all" ]; then
            portaki ci modules --all
          elif [ -n "$REQUESTED" ]; then
            portaki ci modules --only "$REQUESTED"
          else
            portaki ci modules --changed-since "${{ steps.base.outputs.ref }}"
          fi

  # fmt + clippy + test on one runner (setup cost ×3 was burning minutes).
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Vingt-deux endroits portent la version du SDK : le pin du workspace, et le `Cargo.toml` de
      # chaque module, qui l'ecrit pour que release-please attribue une montee a son chemin. Sans
      # ce controle, la divergence n'apparaitrait qu'a la publication, module par module.
      - name: SDK pin
        run: ./scripts/check-sdk-pin.sh

      # Une stable publiée sans notes françaises reste en brouillon au registre, sans que rien ne
      # rougisse : la publication réussit, la version n'entre jamais au catalogue. C'est ce qui a
      # figé les vingt-trois modules. Le contrôle est ici parce qu'il ne coûte rien et qu'il doit
      # tomber en PR, avant que la version soit prise.
      - name: Notes de version françaises
        run: ./scripts/check-changelog-fr.sh

      - name: Format
        run: cargo fmt --all -- --check

      # `--locked` : un `Cargo.lock` qui ne suit plus les `Cargo.toml` fait échouer la PR au lieu
      # d'être réécrit en silence chez chaque développeur. La PR de release y passe aussi — c'est
      # là qu'on verrait release-please cesser de bumper le lock (extra-file `/Cargo.lock`).
      # Host targets only — wasm32 is for the wasm matrix job.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # `--tests` : les tests unitaires et tous les `tests/*.rs`. Nommer les fichiers un à un
      # laissait de côté ceux qu'on oubliait d'ajouter ici (`map_markers.rs`), et la batterie
      # de conformité du SDK (`tests/conformance.rs`) doit tourner avant la publication, qui la
      # relance module par module et refuse de publier sans elle.
      - name: Unit, integration and conformance tests
        run: cargo test --locked --workspace --tests

      - name: Doc tests
        run: cargo test --locked --workspace --doc

  wasm:
    name: wasm (${{ matrix.module }})
    needs: [changes]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      # rustfmt et clippy : la porte de `ci build` est celle de `portaki check` (CLI avec L4).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `~/.cargo/bin` hors du cache : un `portaki` restauré d'un run précédent passerait
          # devant celui que l'action installe.
          cache-bin: "false"
          workspaces: modules/${{ matrix.module }} -> target
          shared-key: module-${{ matrix.module }}

      # Tests (batterie de conformité comprise), build --release, contrôle du manifeste, emballage — le code du
      # module ne tourne qu'ici, sans aucun droit. L'artefact part au job `publish`.
      - uses: PortakiApp/portaki-release-action/build@v2
        with:
          working-directory: modules/${{ matrix.module }}
          artifact: wasm-${{ matrix.module }}

  # Ce qui se publie : les modules dont la VERSION a changé, pas tous ceux qu'un commit touche.
  # Une publication est immuable au registre — republier 0.4.1 avec d'autres octets est refusé.
  # Sans ce filtre, tout merge qui modifiait un module sans bumper sa version (une montée de
  # SDK, un attribut ajouté partout) rougissait `main` : les 21 publications refusées, le
  # quality gate derrière. La version bouge dans la PR de release ; c'est elle qui publie.
  bumped:
    name: detect bumped versions
    needs: changes
    if: >-
      needs.changes.outputs.any == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.module != ''))
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Keep the modules whose version changed
        id: pick
        env:
          MODULES: ${{ needs.changes.outputs.modules }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version_of() { sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n 1; }

          # Un dispatch nomme les modules à publier : c'est une demande explicite, on la sert, sans
          # regarder si la version a bougé. Un module dont la version est déjà au registre sera
          # refusé par lui (`VERSION_ALREADY_PUBLISHED`) ; le quality gate ne lit pas `publish` sur
          # un dispatch, donc le run restera vert — lisez les jobs, pas le badge.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "modules=$MODULES" >>"$GITHUB_OUTPUT"
            echo "any=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          picked='[]'
          for module in $(jq -r '.[]' <<<"$MODULES"); do
            now="$(version_of <"modules/${module}/Cargo.toml")"
            before="$(git show "${BEFORE}:modules/${module}/Cargo.toml" 2>/dev/null | version_of || true)"
            if [ -n "$now" ] && [ "$now" = "$before" ]; then
              echo "::notice title=${module}::${now} unchanged — nothing to publish; the release PR bumps it"
              continue
            fi
            echo "${module}: ${before:-new} → ${now}"
            picked="$(jq -c --arg m "$module" '. + [$m]' <<<"$picked")"
          done

          echo "modules=${picked}" >>"$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$picked")" >>"$GITHUB_OUTPUT"

  # Ne fait que publier l'artefact vérifié : ni build, ni tests, ni cargo. Ce job détient
  # `id-token` et rien d'autre ; le code du module a tourné dans `rust` et `wasm`, sans lui.
  # L'action audite Cargo.lock ici, demande au registre un droit de push court vers son dépôt
  # OCI, atteste le digest (provenance SLSA de ce workflow, rapport d'audit) et l'annonce.
  # L'identité reste ce workflow (`ci.yml`, action composite) et l'environment `release`.
  publish:
    name: publish (${{ matrix.module }})
    needs: [changes, rust, wasm, bumped]
    if: needs.bumped.outputs.any == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # La liaison enregistrée au registre exige un environment sur le canal stable : c'est lui
    # qui porte les relecteurs obligatoires, et le meilleur rapport sécurité/effort du
    # dispositif. Sans lui, l'échange du jeton est refusé — `environment_required`.
    environment: release
    permissions:
      contents: read
      # Sans ce droit, GitHub n'émet aucun jeton OIDC : rien à échanger contre un droit de push,
      # aucune identité pour signer. C'est ce jeton qui remplace tout secret.
      id-token: write
    # Un seul job de publication par module à la fois : deux qui poussent la même version se
    # disputeraient son tag OCI. On met en file : `cancel-in-progress` interromprait une
    # publication en cours, ce qui est pire que de la faire attendre.
    concurrency:
      group: publish-${{ matrix.module }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJson(needs.bumped.outputs.modules) }}
    steps:
      # Les sources sont lues (Cargo.lock, CHANGELOG, listing.json), jamais compilées.
      - uses: actions/checkout@v7

      - uses: PortakiApp/portaki-release-action@v2
        with:
          working-directory: modules/${{ matrix.module }}
          artifact: wasm-${{ matrix.module }}
          api-url: ${{ env.PORTAKI_API_URL }}

  quality:
    name: quality
    needs: [changes, rust, wasm, bumped, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Quality gate
        env:
          ANY: ${{ needs.changes.outputs.any }}
          RUST: ${{ needs.rust.result }}
          WASM: ${{ needs.wasm.result }}
          BUMPED: ${{ needs.bumped.outputs.any }}
          PUBLISH: ${{ needs.publish.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$RUST" != "success" ]; then
            echo "Quality gate failed: RUST=$RUST"
            exit 1
          fi

          if [ "$ANY" = "true" ]; then
            if [ "$WASM" != "success" ]; then
              echo "Quality gate failed: WASM=$WASM"
              exit 1
            fi
            # Rien de bumpé : la publication est sautée, et c'est le résultat attendu.
            if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ "$BUMPED" = "true" ]; then
              if [ "$PUBLISH" != "success" ]; then
                echo "Quality gate failed: PUBLISH=$PUBLISH"
                exit 1
              fi
            fi
          else
            echo "No module changes — wasm/publish not required."
          fi

          echo "Quality gate passed."
