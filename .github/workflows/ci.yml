name: ci

# Quality on pull_request; push main = publish path only (avoids feature push + PR double bill).
# workflow_dispatch: recover from Actions outages / 0-job runs without an empty tip commit
# (empty pushes are skipped by paths-ignore).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/CI.md"
  # `module` sert au premier tir d'une liaison : publier UN module précis, sans attendre
  # qu'un commit le modifie. La liaison enregistrée au registre autorise `workflow_dispatch`.
  workflow_dispatch:
    inputs:
      module:
        description: "Publier ce module seul (laisser vide pour le comportement normal)"
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io/portakiapp
  CI_ARTIFACT_RETENTION_DAYS: "1"
  # La plateforme à qui annoncer la publication. GHCR reçoit l'artefact quoi qu'il arrive ;
  # c'est l'annonce qui le fait entrer dans un catalogue. Variable de dépôt pour viser un
  # staging sans toucher au workflow.
  PORTAKI_API_URL: ${{ vars.PORTAKI_API_URL || 'https://api.portaki.app' }}

jobs:
  changes:
    name: detect changed modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      any: ${{ steps.detect.outputs.any }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve diff base
        id: base
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >>"$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >>"$GITHUB_OUTPUT"
          fi

      - uses: PortakiApp/portaki-release-action/install@7619a50f3c34e2e1e8a17617c75d84eb70e907f2 # v1

      # `portaki ci modules` lit la disposition dans les crates et rend `modules`,
      # `any` et `reason` dans GITHUB_OUTPUT. Il remplace `changed-modules.sh` —
      # quatre-vingt-douze lignes de bash et de jq qui ne servaient que ce dépôt.
      - name: Detect changed modules
        id: detect
        env:
          REQUESTED: ${{ inputs.module }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            portaki ci modules --only "$REQUESTED"
          else
            portaki ci modules --changed-since "${{ steps.base.outputs.ref }}"
          fi

  # fmt + clippy + test on one runner (setup cost ×3 was burning minutes).
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Vingt-deux endroits portent la version du SDK : le pin du workspace, et le `Cargo.toml` de
      # chaque module, qui l'ecrit pour que release-please attribue une montee a son chemin. Sans
      # ce controle, la divergence n'apparaitrait qu'a la publication, module par module.
      - name: SDK pin
        run: ./scripts/check-sdk-pin.sh

      - name: Format
        run: cargo fmt --all -- --check

      # `--locked` : un `Cargo.lock` qui ne suit plus les `Cargo.toml` fait échouer la PR au lieu
      # d'être réécrit en silence chez chaque développeur. La PR de release y passe aussi — c'est
      # là qu'on verrait release-please cesser de bumper le lock (extra-file `/Cargo.lock`).
      # Host targets only — wasm32 is for the wasm matrix job.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # `--tests` : les tests unitaires et tous les `tests/*.rs`. Nommer les fichiers un à un
      # laissait de côté ceux qu'on oubliait d'ajouter ici (`map_markers.rs`), et la batterie
      # de conformité du SDK (`tests/conformance.rs`) doit tourner avant la publication, qui la
      # relance module par module et refuse de publier sans elle.
      - name: Unit, integration and conformance tests
        run: cargo test --locked --workspace --tests

      - name: Doc tests
        run: cargo test --locked --workspace --doc

  wasm:
    name: wasm (${{ matrix.module }})
    needs: [changes]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJson(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # `~/.cargo/bin` appartient au cache dédié ci-dessous, pas à celui-ci. Les deux le
          # revendiquaient : rust-cache restaurait un vieux `portaki`, puis le cache dédié
          # manquait sa clé (le tip du SDK avait bougé) et l'installation trouvait le binaire
          # déjà là. Un chemin, un propriétaire.
          cache-bin: "false"
          workspaces: modules/${{ matrix.module }} -> target
          shared-key: module-${{ matrix.module }}

      # L'action résout le CLI depuis `Cargo.lock` et met en cache sur cette version. Le
      # bloc précédent interrogeait le tip de `main` du SDK à chaque run, ce qui invalidait
      # le cache à chaque commit poussé là-bas.
      # `cache: false` : ce job exécute le code du module (`build.rs`), et l'action v1 sauve le
      # cache en fin de job — un module piégé y remplaçait le `portaki` que les jobs des autres
      # modules restauraient ensuite.
      - uses: PortakiApp/portaki-release-action/install@7619a50f3c34e2e1e8a17617c75d84eb70e907f2 # v1
        with:
          working-directory: modules/${{ matrix.module }}
          cache: "false"

      - name: Build and lint (wasm)
        run: |
          set -euo pipefail
          module="${{ matrix.module }}"
          echo "=== portaki build: modules/${module} ==="
          (cd "modules/${module}" && portaki build --release)
          echo "=== portaki lint: modules/${module} ==="
          (cd "modules/${module}" && portaki lint)

      # Ce que `portaki publish` exigeait avant de pousser — les tests du module, batterie de
      # conformité comprise, et l'emballage OCI — joué ici, dans un job sans secrets. Le job de
      # publication pousse l'artefact avec `--prebuilt` et n'exécute plus rien du module.
      - name: Tests and packaging, as publish checks them
        working-directory: modules/${{ matrix.module }}
        run: portaki publish --dry-run --skip-build --registry "$REGISTRY"

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-${{ matrix.module }}
          path: |
            modules/${{ matrix.module }}/target/wasm32-unknown-unknown/release/*.wasm
            modules/${{ matrix.module }}/target/portaki/
          if-no-files-found: error
          retention-days: ${{ env.CI_ARTIFACT_RETENTION_DAYS }}

  # Ce qui se publie : les modules dont la VERSION a changé, pas tous ceux qu'un commit touche.
  # Une publication est immuable au registre — republier 0.4.1 avec d'autres octets est refusé.
  # Sans ce filtre, tout merge qui modifiait un module sans bumper sa version (une montée de
  # SDK, un attribut ajouté partout) rougissait `main` : les 21 publications refusées, le
  # quality gate derrière. La version bouge dans la PR de release ; c'est elle qui publie.
  bumped:
    name: detect bumped versions
    needs: changes
    if: >-
      needs.changes.outputs.any == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.module != ''))
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.pick.outputs.modules }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Keep the modules whose version changed
        id: pick
        env:
          MODULES: ${{ needs.changes.outputs.modules }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version_of() { sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n 1; }

          # Un dispatch nomme le module à publier : c'est une demande explicite, on la sert.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "modules=$MODULES" >>"$GITHUB_OUTPUT"
            echo "any=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          picked='[]'
          for module in $(jq -r '.[]' <<<"$MODULES"); do
            now="$(version_of <"modules/${module}/Cargo.toml")"
            before="$(git show "${BEFORE}:modules/${module}/Cargo.toml" 2>/dev/null | version_of || true)"
            if [ -n "$now" ] && [ "$now" = "$before" ]; then
              echo "::notice title=${module}::${now} unchanged — nothing to publish; the release PR bumps it"
              continue
            fi
            echo "${module}: ${before:-new} → ${now}"
            picked="$(jq -c --arg m "$module" '. + [$m]' <<<"$picked")"
          done

          echo "modules=${picked}" >>"$GITHUB_OUTPUT"
          echo "any=$(jq 'length > 0' <<<"$picked")" >>"$GITHUB_OUTPUT"

  # Ne fait que pousser l'artefact vérifié : ni build, ni tests, ni `build.rs`. Ce job détient
  # `id-token` et `packages: write` ; le code du module a tourné dans `rust` et `wasm`, sans eux.
  # L'identité OIDC ne change pas : ce workflow, l'environment `release`.
  publish:
    name: publish (${{ matrix.module }})
    needs: [changes, rust, wasm, bumped]
    if: needs.bumped.outputs.any == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # La liaison enregistrée au registre exige un environment sur le canal stable : c'est lui
    # qui porte les relecteurs obligatoires, et le meilleur rapport sécurité/effort du
    # dispositif. Sans lui, l'échange du jeton est refusé — `environment_required`.
    environment: release
    permissions:
      contents: read
      packages: write
      # Sans ce droit, GitHub n'émet aucun jeton OIDC et il n'y a rien à échanger contre un
      # credential de publication. C'est ce jeton qui remplace un secret longue durée.
      id-token: write
    # Un seul job de publication par module à la fois. Deux qui poussent le même module en
    # parallèle écrasent tour à tour le même tag OCI, et le catalogue finit par référencer un
    # digest que le tag ne porte plus. On met en file : `cancel-in-progress` interromprait une
    # publication en cours, ce qui est pire que de la faire attendre.
    concurrency:
      group: publish-${{ matrix.module }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        module: ${{ fromJson(needs.bumped.outputs.modules) }}
    steps:
      # Les sources sont lues (manifeste, i18n, CHANGELOG), jamais compilées.
      - uses: actions/checkout@v7

      # Pour `cargo install portaki-cli` depuis crates.io, et rien d'autre.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Sans cache : un binaire restauré vaut ce que vaut chaque job qui peut écrire le cache.
      - uses: PortakiApp/portaki-release-action/install@7619a50f3c34e2e1e8a17617c75d84eb70e907f2 # v1
        with:
          working-directory: modules/${{ matrix.module }}
          cache: "false"

      - name: Require a CLI that publishes without running the module
        run: |
          if ! portaki publish --help | grep -q -- '--prebuilt'; then
            echo "::error::this CLI has no \`publish --prebuilt\` and would run the module's tests here, with the publishing rights. Raise portaki-sdk to the release that has it."
            exit 1
          fi

      # upload-artifact roots at modules/<mod>/target (LCA of wasm + portaki/).
      - name: Download wasm artifact
        uses: actions/download-artifact@v8
        with:
          name: wasm-${{ matrix.module }}
          path: modules/${{ matrix.module }}/target

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `--prebuilt` : pousse l'artefact de `wasm` tel quel, après avoir vérifié qu'il porte l'id
      # et la version des sources de ce module — un module piégé ne publie pas sous un autre nom.
      - name: Publish
        working-directory: modules/${{ matrix.module }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: portaki publish --prebuilt --registry "$REGISTRY" --channel stable

      # `always()` : un rapport conditionné à l'échec ne pourrait jamais éteindre une alerte.
      - name: Report the run to Portaki
        if: always()
        working-directory: modules/${{ matrix.module }}
        run: portaki ci report --outcome "${{ job.status }}"

      # Propre à cette organisation, donc hors de l'action : un paquet fraîchement créé
      # naît privé, et un catalogue public ne peut pas le lire.
      - name: Make the GHCR package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: portaki-modules-${{ matrix.module }}
        run: |
          set -euo pipefail
          seen="$(gh api "orgs/PortakiApp/packages/container/${PACKAGE}" --jq .visibility 2>/dev/null || echo unknown)"
          if [ "$seen" = "public" ]; then
            echo "${PACKAGE} is already public."
            exit 0
          fi
          gh api --method PATCH "orgs/PortakiApp/packages/container/${PACKAGE}" --field visibility=public \
            || echo "::warning::could not set ${PACKAGE} public — do it once by hand in the package settings"

  quality:
    name: quality
    needs: [changes, rust, wasm, bumped, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Quality gate
        env:
          ANY: ${{ needs.changes.outputs.any }}
          RUST: ${{ needs.rust.result }}
          WASM: ${{ needs.wasm.result }}
          BUMPED: ${{ needs.bumped.outputs.any }}
          PUBLISH: ${{ needs.publish.result }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [ "$RUST" != "success" ]; then
            echo "Quality gate failed: RUST=$RUST"
            exit 1
          fi

          if [ "$ANY" = "true" ]; then
            if [ "$WASM" != "success" ]; then
              echo "Quality gate failed: WASM=$WASM"
              exit 1
            fi
            # Rien de bumpé : la publication est sautée, et c'est le résultat attendu.
            if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ] && [ "$BUMPED" = "true" ]; then
              if [ "$PUBLISH" != "success" ]; then
                echo "Quality gate failed: PUBLISH=$PUBLISH"
                exit 1
              fi
            fi
          else
            echo "No module changes — wasm/publish not required."
          fi

          echo "Quality gate passed."
