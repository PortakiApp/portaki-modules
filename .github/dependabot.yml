# Il n'y en avait pas.
#
# Les alertes Dependabot sont actives (dépôt public, c'est le défaut), mais une alerte signale ;
# elle ne propose rien. Sans ce fichier, aucune montée de version n'arrive sous forme de PR.
#
# Le verrou est versionné ici, contrairement à `portaki-sdk` : une PR de Dependabot le met donc
# à jour, et ce qui est audité est exactement ce qui sera construit.
version: 2

updates:
  # Un workspace unique pour les vingt et un modules : un verrou, un lot.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependances-mineures:
        update-types: [minor, patch]
    ignore:
      # Le SDK monte par un commit qu'on relit : `requiresModuleSdk` est tamponné depuis le
      # graphe résolu par cargo, donc une montée automatique changerait ce que les modules
      # annoncent au registre sans que personne ne l'ait décidé. Voir 9a2a374.
      - dependency-name: "portaki-sdk*"
      - dependency-name: "portaki-connectors"
      - dependency-name: "portaki-test-utils"

  # Ce workflow publie sur GHCR et échange un jeton OIDC contre un credential de publication :
  # une action compromise s'exécute avec ces droits.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
