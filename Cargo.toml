[workspace]
resolver = "2"
members = ["modules/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/PortakiApp/portaki-modules"
homepage = "https://portaki.app"
documentation = "https://github.com/PortakiApp/portaki-modules#readme"
readme = "README.md"
authors = ["Syntax Labs <support@syntax-labs.fr>"]
categories = ["wasm"]
keywords = ["portaki", "wasm", "extism", "oci", "module"]
rust-version = "1.75"

[workspace.dependencies]
# Le SDK vient de crates.io, pas de `branch = "main"`.
#
# La branche faisait qu'un rebuild pouvait changer de SDK sans qu'aucun commit ne bouge ici :
# `requiresModuleSdk` est tamponné depuis le graphe résolu par cargo, donc un module publié
# hier et republié aujourd'hui n'annonçait pas la même version — sans que rien ne le dise.
#
# Une version fixe rend le contraire vrai : monter de SDK devient un commit qu'on relit.
#
# Et un commit qui se PUBLIE. Ce qui part au registre tamponne `requiresModuleSdk` depuis le
# graphe résolu ici : tant que les vingt et un artefacts ne sont pas reconstruits, ils annoncent
# l'ancien SDK, quoi que dise ce fichier. Or release-please ne publie que sur un type publiable,
# et `chore` n'en est pas un — la montée en 4.0.0 (fe307f0) n'a donc déclenché aucune release.
#
# Une montée de SDK s'écrit donc `fix(deps):`, jamais `chore(deps):`. `always-update` porte
# ensuite les vingt et un dans la même release, comme en 0c04c55.
portaki-sdk = "4.0.0"
portaki-sdk-macros = "4.0.0"
portaki-connectors = "4.0.0"
portaki-test-utils = "4.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "rng-getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
serial_test = "4"
extism-pdk = "1.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
