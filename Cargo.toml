[workspace]
resolver = "2"
members = ["modules/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/PortakiApp/portaki-modules"
homepage = "https://portaki.app"
documentation = "https://github.com/PortakiApp/portaki-modules#readme"
readme = "README.md"
authors = ["Syntax Labs <support@syntax-labs.fr>"]
categories = ["wasm"]
keywords = ["portaki", "wasm", "extism", "oci", "module"]
rust-version = "1.75"

[workspace.dependencies]
# Le SDK vient de crates.io, pas de `branch = "main"`.
#
# La branche faisait qu'un rebuild pouvait changer de SDK sans qu'aucun commit ne bouge ici :
# `requiresModuleSdk` est tamponné depuis le graphe résolu par cargo, donc un module publié
# hier et republié aujourd'hui n'annonçait pas la même version — sans que rien ne le dise.
#
# Une version fixe rend le contraire vrai : monter de SDK devient un commit qu'on relit.
#
# Et qui se PUBLIE, depuis que les manifestes déclarent le SDK.
#
# Ce qui part au registre annonce `requiresModuleSdk`, et release-please attribue les commits PAR
# CHEMIN — son journal le dit, « No commits for path: modules/access-guide, skipping ». Un bump
# qui ne touchait que ce fichier n'était attribué à aucun paquet : fe307f0 puis ce5107f, deux
# montées, zéro publication, les vingt et un artefacts annonçant encore l'ancien SDK.
#
# Chaque module écrit donc la version de `portaki-sdk` dans son propre `Cargo.toml` — avec les
# features, donc les permissions, qu'il réclame — au lieu de l'hériter d'ici. Une montée touche
# les vingt et un chemins, elle est attribuable, elle publie. `portaki build` en tire
# `requiresModuleSdk` : il n'y a plus de manifeste écrit à la main pour le déclarer.
#
# Le prix est vingt-deux endroits à tenir ensemble. `scripts/check-sdk-pin.sh` les compare à
# chaque CI.
portaki-sdk = "8.7.0"
portaki-sdk-macros = "8.7.0"
portaki-connectors = "8.7.0"
portaki-test-utils = "8.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "rng-getrandom"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
serial_test = "4"
extism-pdk = "1.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
